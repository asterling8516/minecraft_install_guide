<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homestead - Mod List</title>
    <meta name="description" content="List of all mods running on the Homestead server.">
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .mod-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }
        .mod-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            word-break: break-all;
        }
        .mod-item strong {
            display: block;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        .mod-item span {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }
        .search-container {
            margin-bottom: 2rem;
            text-align: center;
        }
        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus {
            border-color: #5865F2;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Server Mod List</h1>
            <div style="margin-top: 1rem; margin-bottom: 2rem; display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap;">
                <a href="index.html" style="color: #5865F2; text-decoration: none; font-weight: 600;">⬅️ Back to Installation Guide</a>
                <a href="rules.html" style="color: #5865F2; text-decoration: none; font-weight: 600;">📜 View Server Rules</a>
            </div>
            <p>Here are all the 0 mods currently active on the Homestead server.</p>
        </header>

        <main>
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search mods...">
            </div>
            <div class="mod-list" id="modList">
            </div>
        </main>
        
        <footer>
            <p>See you on the server! 🚀</p>
            <p style="margin-top: 1rem; font-size: 0.9rem; color: rgba(255, 255, 255, 0.6);">Built and Maintained by <a href="https://astralsterling.com/" style="color: #5865F2; text-decoration: none;">Astral Sterling</a></p>
        </footer>
    </div>
    <script>
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.mod-item');
            
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                if (text.includes(term)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
